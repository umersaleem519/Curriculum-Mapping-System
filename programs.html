<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurricAlign Pro - Programs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-layer-group me-2"></i> CurricAlign Pro
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item admin-only"><a class="nav-link active" href="programs.html">Programs</a></li>
                    <li class="nav-item"><a class="nav-link" href="plos.html">PLOs</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="clos.html">CLOs</a></li>
                    <li class="nav-item"><a class="nav-link" href="mapping.html">Mapping Matrix</a></li>
                    <li class="nav-item admin-only"><a class="nav-link" href="reports.html">Reports</a></li>
                    <li class="nav-item ms-3 d-flex align-items-center">
                        <span id="userDisplay" class="text-secondary me-3 small"></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="App.logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 page-container">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h1 class="mb-1">Academic Programs</h1>
                <p class="text-secondary mb-0">Manage university departments and degrees.</p>
            </div>
            <button class="btn btn-primary-custom admin-only" onclick="openAddModal()">
                <i class="fa-solid fa-plus me-2"></i> Add Program
            </button>
        </div>

        <div class="glass-card p-4">
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th width="15%">Code</th>
                            <th width="40%">Program Name</th>
                            <th width="30%">Department</th>
                            <th width="15%" class="text-end admin-only">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="programTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="progModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Program</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="progForm">
                        <input type="hidden" id="progId">
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select form-control-custom" id="progDept" required></select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Code</label>
                                <input type="text" class="form-control form-control-custom" id="progCode"
                                    placeholder="e.g. BSCS" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Program Name</label>
                                <input type="text" class="form-control form-control-custom" id="progName"
                                    placeholder="e.g. BS Computer Science" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" onclick="saveProgram()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        let modal;
        let deptsMap = {};

        document.addEventListener('DOMContentLoaded', async () => {
            // Check admin access
            const session = Store.getSession();
            if (session && session.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }

            modal = new bootstrap.Modal(document.getElementById('progModal'));

            // Setup Departments
            const depts = await Store.getDepartments();
            const deptSelect = document.getElementById('progDept');

            depts.forEach(d => {
                deptsMap[d.id] = d.name;
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                deptSelect.appendChild(opt);
            });

            await renderTable();
        });

        async function renderTable() {
            const progs = await Store.getPrograms();
            const tbody = document.getElementById('programTableBody');
            tbody.innerHTML = '';

            if (progs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4">No programs found.</td></tr>`;
                return;
            }

            progs.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${p.code}</strong></td>
                    <td>${p.name}</td>
                    <td><span class="badge bg-secondary">${deptsMap[p.deptId] || 'Unknown'}</span></td>
                    <td class="text-end admin-only">
                        <button class="btn btn-sm btn-outline-light me-1" onclick="openEditModal('${p.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProgram('${p.id}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            App.setupNavigation(); // Re-apply admin-only hiding if needed
        }

        function openAddModal() {
            document.getElementById('progForm').reset();
            document.getElementById('progId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Program';
            modal.show();
        }

        async function openEditModal(id) {
            const progs = await Store.getPrograms();
            const p = progs.find(x => x.id === id);
            if (p) {
                document.getElementById('progId').value = p.id;
                document.getElementById('progDept').value = p.deptId;
                document.getElementById('progCode').value = p.code;
                document.getElementById('progName').value = p.name;
                document.getElementById('modalTitle').textContent = 'Edit Program';
                modal.show();
            }
        }

        async function saveProgram() {
            const form = document.getElementById('progForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const id = document.getElementById('progId').value;
            const data = {
                deptId: document.getElementById('progDept').value,
                code: document.getElementById('progCode').value,
                name: document.getElementById('progName').value
            };

            try {
                if (id) {
                    await Store.updateProgram(id, data);
                    App.showToast('Program updated');
                } else {
                    await Store.addProgram(data);
                    App.showToast('Program added');
                }
                modal.hide();
                await renderTable();
            } catch (err) {
                App.showToast(err.message, 'danger');
            }
        }

        async function deleteProgram(id) {
            if (confirm('Are you sure you want to delete this program?')) {
                try {
                    await Store.deleteProgram(id);
                    App.showToast('Program deleted', 'danger');
                    await renderTable();
                } catch (err) {
                    App.showToast('Error deleting program', 'danger');
                }
            }
        }
    </script>
</body>

</html>
