<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurricAlign Pro - User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-layer-group me-2"></i> CurricAlign Pro
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item admin-only"><a class="nav-link" href="programs.html">Programs</a></li>
                    <li class="nav-item admin-only"><a class="nav-link active" href="admin_users.html">Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="plos.html">PLOs</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="clos.html">CLOs</a></li>
                    <li class="nav-item"><a class="nav-link" href="mapping.html">Mapping Matrix</a></li>
                    <li class="nav-item admin-only"><a class="nav-link" href="reports.html">Reports</a></li>
                    <li class="nav-item ms-3 d-flex align-items-center">
                        <span id="userDisplay" class="text-secondary me-3 small"></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="App.logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 page-container">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h1 class="mb-1">User Management</h1>
                <p class="text-secondary mb-0">Approve registrations and manage faculty access.</p>
            </div>
            <button class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#addFacultyModal">
                <i class="fa-solid fa-user-plus"></i> Add Faculty
            </button>
        </div>

        <div class="glass-card p-4">
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th width="20%">Username</th>
                            <th width="30%">Full Name</th>
                            <th width="15%">Role</th>
                            <th width="15%">Status</th>
                            <th width="20%" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Faculty Modal 
         This modal provides a form for Admins to quickly create new Faculty users 
         with pre-approved status, bypassing the standard signup & approval flow. -->
    <div class="modal fade" id="addFacultyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Add New Faculty</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- Form invokes addFaculty(event) on submission -->
                <div class="modal-body">
                    <form id="addFacultyForm" onsubmit="addFaculty(event)">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="facUsername" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="facFullName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="facPassword" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-custom">Create Faculty Account</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = Store.getSession();
            if (session && session.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }
            await renderTable();
        });

        async function renderTable() {
            const users = await Store.getUsers();
            // Don't show the currently logged in admin so they don't delete themselves
            const session = Store.getSession();
            const filteredUsers = users.filter(u => u.id !== session.id);

            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (filteredUsers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4">No other users found.</td></tr>`;
                return;
            }

            filteredUsers.forEach(u => {
                let statusBadge = u.status === 'approved'
                    ? '<span class="badge bg-success">Approved</span>'
                    : '<span class="badge bg-warning text-dark">Pending</span>';

                let actionButtons = '';

                if (u.status === 'pending') {
                    actionButtons += `<button class="btn btn-sm btn-success me-1" onclick="updateStatus('${u.id}', 'approved')"><i class="fa-solid fa-check"></i> Approve</button>`;
                } else {
                    actionButtons += `<button class="btn btn-sm btn-warning text-dark me-1" onclick="updateStatus('${u.id}', 'pending')"><i class="fa-solid fa-ban"></i> Suspend</button>`;
                }

                actionButtons += `<button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')"><i class="fa-solid fa-trash"></i></button>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${u.username}</strong></td>
                    <td>${u.fullName || 'N/A'}</td>
                    <td><span class="badge bg-secondary">${u.role.toUpperCase()}</span></td>
                    <td>${statusBadge}</td>
                    <td class="text-end">${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
            App.setupNavigation();
        }

        async function updateStatus(id, newStatus) {
            try {
                await Store.updateUserStatus(id, newStatus);
                App.showToast(`User marked as ${newStatus}`);
                await renderTable();
            } catch (err) {
                App.showToast('Error updating status', 'danger');
            }
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user? Their course assignments will be cleared.')) {
                try {
                    await Store.deleteUser(id);
                    App.showToast('User deleted', 'danger');
                    await renderTable();
                } catch (err) {
                    App.showToast('Error deleting user', 'danger');
                }
            }
        }

        // Handles the Add Faculty form submission.
        // Gathers input data, calls the API to create the user, resets the form,
        // closes the modal, and forces a table re-render.
        async function addFaculty(event) {
            event.preventDefault(); // Prevent standard form submission

            // Collect data from the form
            const username = document.getElementById('facUsername').value;
            const fullName = document.getElementById('facFullName').value;
            const password = document.getElementById('facPassword').value;

            try {
                // Call the API via the Store
                await Store.addUser({ username, fullName, password });

                App.showToast('Faculty created successfully');

                // Reset form inputs
                document.getElementById('addFacultyForm').reset();

                // Hide the Bootstrap modal programmatically
                bootstrap.Modal.getInstance(document.getElementById('addFacultyModal')).hide();

                // Refresh the table to show the new user immediately
                await renderTable();
            } catch (err) {
                // Display error (e.g., if username already exists)
                App.showToast(err.message || 'Error creating faculty user', 'danger');
            }
        }
    </script>
</body>

</html>
