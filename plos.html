<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurricAlign Pro - PLOs</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-layer-group me-2"></i> CurricAlign Pro
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="plos.html">PLOs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">Courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clos.html">CLOs</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="mapping.html">Mapping Matrix</a></li>
                    <li class="nav-item admin-only"><a class="nav-link" href="reports.html">Reports</a></li>
                    <li class="nav-item ms-3 d-flex align-items-center">
                        <span id="userDisplay" class="text-secondary me-3 small"></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="App.logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5 page-container">

        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h1 class="mb-1">Program Learning Outcomes (PLOs)</h1>
                <p class="text-secondary mb-0">Define the overarching goals for your program.</p>
            </div>
            <button class="btn btn-primary-custom admin-only" onclick="openAddModal()">
                <i class="fa-solid fa-plus me-2"></i> Add PLO
            </button>
        </div>

        <div class="glass-card p-4">
            <!-- Filter by Program -->
            <div class="row mb-4">
                <div class="col-md-5">
                    <label class="form-label">Program</label>
                    <select class="form-select form-control-custom" id="progFilter" onchange="renderTable()">
                        <option value="ALL">All Programs</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th width="15%">PLO Code</th>
                            <th width="20%">Program</th>
                            <th width="50%">Description</th>
                            <th width="15%" class="text-end admin-only">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ploTableBody">
                        <!-- Rendered via JS -->
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="text-center py-5 d-none">
                <div class="stat-icon icon-purple mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h5 class="text-white">No PLOs Found</h5>
                <p class="text-secondary">Get started by adding your first Program Learning Outcome.</p>
                <button class="btn btn-outline-custom mt-2" onclick="openAddModal()">Add PLO</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="ploModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add PLO</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="ploForm">
                        <input type="hidden" id="ploId">
                        <div class="mb-3">
                            <label class="form-label">Program</label>
                            <select class="form-select form-control-custom" id="ploProgId" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="ploCode" class="form-label">PLO Code</label>
                            <input type="text" class="form-control form-control-custom" id="ploCode"
                                placeholder="e.g. PLO-1" required>
                        </div>
                        <div class="mb-3">
                            <label for="ploDesc" class="form-label">Description</label>
                            <textarea class="form-control form-control-custom" id="ploDesc" rows="3"
                                placeholder="Enter PLO description..." required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" onclick="savePlo()">Save PLO</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        let modal;
        let progsMap = {};

        document.addEventListener('DOMContentLoaded', async () => {
            modal = new bootstrap.Modal(document.getElementById('ploModal'));
            await loadPrograms();
            await renderTable();
        });

        async function loadPrograms() {
            const progs = await Store.getPrograms();
            const filter = document.getElementById('progFilter');
            const modSelect = document.getElementById('ploProgId');

            progs.forEach(p => {
                progsMap[p.id] = p.code;
                filter.innerHTML += `<option value="${p.id}">${p.name} (${p.code})</option>`;
                modSelect.innerHTML += `<option value="${p.id}">${p.name} (${p.code})</option>`;
            });
        }

        async function renderTable() {
            const allPlos = await Store.getPLOs();
            const filterVal = document.getElementById('progFilter').value;
            const plos = filterVal === 'ALL' ? allPlos : allPlos.filter(p => p.progId === filterVal);

            const tbody = document.getElementById('ploTableBody');
            const emptyState = document.getElementById('emptyState');

            tbody.innerHTML = '';

            if (plos.length === 0) {
                emptyState.classList.remove('d-none');
                tbody.parentElement.classList.add('d-none');
            } else {
                emptyState.classList.add('d-none');
                tbody.parentElement.classList.remove('d-none');

                plos.forEach(plo => {
                    const progCode = progsMap[plo.progId] || 'All';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${plo.code}</strong></td>
                        <td><span class="badge bg-secondary">${progCode}</span></td>
                        <td>${plo.description}</td>
                        <td class="text-end admin-only">
                            <button class="btn btn-sm btn-outline-light me-1" onclick="openEditModal('${plo.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deletePlo('${plo.id}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            App.setupNavigation(); // enforce RBAC hiding
        }

        async function openAddModal() {
            const progs = await Store.getPrograms();
            if (progs.length === 0) {
                alert("Please add a Program first."); return;
            }
            document.getElementById('ploForm').reset();
            document.getElementById('ploId').value = '';
            document.getElementById('modalTitle').textContent = 'Add PLO';
            modal.show();
        }

        async function openEditModal(id) {
            const plos = await Store.getPLOs();
            const plo = plos.find(p => p.id === id);
            if (plo) {
                document.getElementById('ploId').value = plo.id;
                document.getElementById('ploProgId').value = plo.progId;
                document.getElementById('ploCode').value = plo.code;
                document.getElementById('ploDesc').value = plo.description;
                document.getElementById('modalTitle').textContent = 'Edit PLO';
                modal.show();
            }
        }

        async function savePlo() {
            const form = document.getElementById('ploForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const id = document.getElementById('ploId').value;
            const ploData = {
                progId: document.getElementById('ploProgId').value,
                code: document.getElementById('ploCode').value,
                description: document.getElementById('ploDesc').value
            };

            try {
                if (id) {
                    await Store.updatePLO(id, ploData);
                    App.showToast('PLO updated successfully');
                } else {
                    await Store.addPLO(ploData);
                    App.showToast('PLO added successfully');
                }

                modal.hide();
                await renderTable();
            } catch (error) {
                App.showToast(error.message, 'danger');
            }
        }

        async function deletePlo(id) {
            if (confirm('Are you sure you want to delete this PLO? Linked mappings will also be removed.')) {
                try {
                    await Store.deletePLO(id);
                    App.showToast('PLO deleted successfully', 'danger');
                    await renderTable();
                } catch (error) {
                    App.showToast('Failed to delete PLO', 'danger');
                }
            }
        }
    </script>
</body>

</html>
