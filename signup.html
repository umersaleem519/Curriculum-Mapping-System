<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CurricAlign Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="glass-card login-card p-5 text-center">
            <h2 class="mb-2"
                style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                Faculty Registration</h2>
            <p class="text-secondary mb-4">Request access to the Curriculum Module</p>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="mb-3 text-start">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control form-control-custom" required
                        placeholder="e.g. Dr. Jane Doe">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control form-control-custom" required
                        placeholder="Desired username">
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control form-control-custom" required>
                </div>

                <div id="signupMsg" class="alert alert-info d-none small text-start">
                    Your account will be pending until an Administrator approves your access.
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mb-3">Register Account</button>
            </form>

            <a href="login.html" class="text-secondary text-decoration-none small">Already have an account? Sign In</a>
        </div>
    </div>

    <script src="assets/js/store.js"></script>
    <script>
        if (Store.getSession()) {
            window.location.href = 'index.html';
        }

        // Show warning about approval
        document.getElementById('password').addEventListener('focus', () => {
            document.getElementById('signupMsg').classList.remove('d-none');
        });

        async function handleSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const success = await Store.signup(user, fullName, pass);

            if (success) {
                alert('Registration successful! Please wait for an Admin to approve your account before logging in.');
                window.location.href = 'login.html';
            } else {
                alert('Username already exists. Please choose another.');
            }
        }
    </script>
</body>

</html>
